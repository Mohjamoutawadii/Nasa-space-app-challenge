<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroHeroes Journey</title>
    <link rel="stylesheet" href="/src/css/path.css">
</head>

<body>

    <header class="top-bar">
        <a href="home.html" class="logo">🚀 ASTROHEROES</a>
        <span>YOUR JOURNEY</span>
    </header>

    <main class="journey-container">

        <h1>Your Space Adventure!</h1>
        <p class="subtitle">Complete every mission to become an AstroHero!</p>

        <div class="journey-map">

            <!-- These SVG paths for the journey route created by chatgpt after explaining the desired design. The paths are designed to be responsive and visually appealing, guiding the user through the different missions in a space-themed adventure. -->
            <svg class="journey-route desktop-route"
                viewBox="0 0 1000 300"
                preserveAspectRatio="none">

                <path
                    d="M80 165 C170 165 190 100 310 145 S440 220 630 185 S810 165 920 165"
                    fill="none"
                    stroke="#9AA8C4"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="5 13"
                />
            </svg>


            <svg class="journey-route mobile-route"
                viewBox="0 0 400 1100"
                preserveAspectRatio="none">

                <path
                    d="M200 55 C200 125 95 125 95 245 C95 350 300 350 300 465 C300 555 135 555 135 680"
                    fill="none"
                    stroke="#9AA8C4"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="5 13"
                />
            </svg>

           
        
            <div class="map-point start-point">
                <span class="point-circle start-circle">
                        <span>🚀</span>
                    
                </span>
                 <a href="start.html" class="point-label">START</a>
            </div>

            
            <div class="map-point mission-one locked-point" id="mission-one">

                    <div class="point-circle">
                        <span>🌕</span>
                    </div>

                    <a href="mission1.html" class="point-label">MISSION 01 🔒</a>
                    <span class="mission-name">Find a Lunar Base</span>
                  

            </div>

          
            <div class="map-point mission-two locked-point">
                <div class="point-circle">
                    <span>🔭</span>
                </div>
                <a href="mission2.html" class="point-label">MISSION 02 🔒</a>
                <span class="mission-name">Survival Protocol</span>
                
            </div>

            
         
           
            <div class="map-point certificate-point locked-point">
                <div class="point-circle certificate-circle">
                    <span>🏆</span>
                </div>
                <span class="point-label">FINAL DESTINATION</span>
                <a href="/certif.html" class="mission-name">AstroHero Certificate</a>
                <a >
   
            </div>

        </div>

    </main>
<script type="module"  src="/src/js/path.js"></script>
</body>

</html>
